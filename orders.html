<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    font-family:Poppins;
    background:#0b0f1a;
    color:#fff;
}

.container{
    padding:20px;
}

h2{
    margin-bottom:20px;
}

button{
    background:#facc15;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:15px;
}

/* TABLE STYLE */
table{
    width:100%;
    border-collapse:collapse;
    background:#111827;
    border-radius:12px;
    overflow:hidden;
}

thead{
    background:#1f2937;
}

th,td{
    padding:12px;
    border-bottom:1px solid #222;
    text-align:left;
    font-size:14px;
}

tr:hover{
    background:#1f2937;
}

/* status badge */
select{
    padding:6px;
    border-radius:6px;
    border:none;
    background:#0b0f1a;
    color:#fff;
}
</style>

</head>
<body>

<div class="container">

    <h2>📦 Orders Management</h2>

    <button onclick="addOrder()">
        + Tambah Order Test
    </button>

    <!-- TABLE START -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>TRX</th>
                <th>Product ID</th>
                <th>Username</th>
                <th>Gamertag</th>
                <th>Phone</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody id="orderList">
            <!-- DATA SUPABASE MASUK SINI -->
        </tbody>

    </table>

</div>

<script type="module" src="js/orders.js"></script>

</body>
</html>
