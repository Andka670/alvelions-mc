<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){var r=document.documentElement,t='dark';try{var h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(new Date()));t=(h>=6&&h<18)?'light':'dark';var c=JSON.parse(localStorage.getItem('alvelions-theme-override-v5')||'null');if(c&&(c.theme==='light'||c.theme==='dark')&&c.until>Date.now())t=c.theme}catch(e){}r.setAttribute('data-theme',t)})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password baru – ALVELIONS MC</title>
<link rel="icon" type="image/png" href="assets/alvelions-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body class="theme-home">
<div class="auth">
<aside class="auth-side"><img class="float" src="assets/alvelions-logo.png" alt="Logo ALVELIONS MC"><h2>Buat password baru yang kuat.</h2></aside>
<main class="auth-main"><button class="btn icon-btn theme-pos" id="themeBtn" aria-label="Ganti tema"></button>
<div class="auth-card"><a class="brand m-brand" href="index.html"><img src="assets/alvelions-logo.png" alt="">ALVELIONS MC</a>
<h1>Password baru</h1><p class="sub">Buat password baru untuk akunmu.</p>
<label class="field"><span>Password baru</span><div><i class="l fa-solid fa-lock"></i><input id="password" type="password" placeholder="Password baru" autocomplete="new-password"><button type="button" class="eye" aria-label="Tampilkan password" data-eye="password"><i class="fa-regular fa-eye"></i></button></div><small>Minimal 6 karakter.</small></label><label class="field"><span>Konfirmasi password</span><div><i class="l fa-solid fa-lock"></i><input id="confirmPassword" type="password" placeholder="Ulangi password baru" autocomplete="new-password"><button type="button" class="eye" aria-label="Tampilkan password" data-eye="confirmPassword"><i class="fa-regular fa-eye"></i></button></div></label><button class="btn btn-gold" onclick="updatePassword()">Simpan password</button>
<p id="message" role="status"></p>
<p class="alt"><a href="login.html">Kembali ke login</a></p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
async function updatePassword() {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (!password || !confirmPassword) {
        message.textContent = "Semua kolom wajib diisi.";
        message.style.color = "#ef4444";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Konfirmasi password tidak cocok.";
        message.style.color = "#ef4444";
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    if (error) {
        message.textContent = error.message;
        message.style.color = "#ef4444";
    } else {
        message.textContent = "Password berhasil diperbarui!";
        message.style.color = "#22c55e";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);
    }
}
</script>
<script>
function setT(t,s){const r=document.documentElement,b=document.getElementById("themeBtn");r.setAttribute("data-theme",t);b.innerHTML='<i class="fa-solid fa-'+(t==="dark"?"sun":"moon")+'"></i>';b.setAttribute("aria-label",t==="dark"?"Ganti ke tema siang":"Ganti ke tema malam");if(s)try{localStorage.setItem("alvelions-theme-override-v5",JSON.stringify({theme:t,until:Date.now()+12*36e5}))}catch(e){}}
setT(document.documentElement.getAttribute("data-theme"),false);
document.getElementById("themeBtn").onclick=()=>setT(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);
document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye),s=i.type==="password";i.type=s?"text":"password";b.innerHTML='<i class="fa-regular fa-eye'+(s?'-slash':'')+'"></i>'});
document.querySelector(".auth-card").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")updatePassword()});
</script>
<script src="js/atmosphere-effects.js"></script>
</body></html>
