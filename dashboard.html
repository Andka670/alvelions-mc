<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - Alvelions MC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#22c55e;
    --primary-dark:#16a34a;
    --bg:#020617;
    --bg2:#0f172a;
    --card:#0b1220;
    --border:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
}

body{
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#1e293b 0%,#020617 40%),
    radial-gradient(circle at bottom right,#052e16 0%,transparent 35%);
    color:var(--text);
    min-height:100vh;
}

.container{
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:260px;
    background:rgba(11,18,32,.95);
    backdrop-filter:blur(15px);
    border-right:1px solid var(--border);
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:sticky;
    top:0;
}

.sidebar h2{
    text-align:center;
    color:var(--primary);
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:30px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    color:#e2e8f0;
    text-decoration:none;
    border-radius:12px;
    margin-bottom:8px;
    transition:.25s;
    font-size:14px;
    font-weight:500;
}

.sidebar a i{
    width:18px;
    text-align:center;
}

.sidebar a:hover{
    background:#172033;
    transform:translateX(4px);
}

.sidebar a.active{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#000;
    font-weight:700;
    box-shadow:0 10px 25px rgba(34,197,94,.25);
}

.logout{
    background:#dc2626 !important;
    color:white !important;
    margin-top:15px;
}

.logout:hover{
    background:#b91c1c !important;
}

.copyright{
    text-align:center;
    font-size:12px;
    color:#64748b;
    padding-top:20px;
    border-top:1px solid var(--border);
}

/* =========================
   CONTENT
========================= */

.content{
    flex:1;
    padding:35px;
    overflow:auto;
}

.page{
    display:none;
    animation:fade .3s ease;
}

.page.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   CARD
========================= */

.card{
    background:rgba(11,18,32,.85);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:
    0 10px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.card h2{
    margin-bottom:10px;
    font-size:24px;
    font-weight:700;
}

.card p{
    color:var(--muted);
    line-height:1.7;
}

/* =========================
   PROFILE INFO
========================= */

#profile p{
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
    font-size:15px;
}

#profile span{
    color:var(--primary);
    font-weight:600;
}

/* =========================
   BUTTON
========================= */

button{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#000;
    border:none;
    border-radius:12px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:700;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(34,197,94,.25);
}

/* =========================
   TABLE
========================= */

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    margin-top:20px;
    border-radius:14px;
}

table thead{
    background:#111827;
}

table th{
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
}

table th,
table td{
    padding:14px;
    text-align:left;
}

table tbody tr{
    border-bottom:1px solid rgba(255,255,255,.05);
    transition:.2s;
}

table tbody tr:hover{
    background:rgba(255,255,255,.03);
}

table td{
    color:#e2e8f0;
    font-size:13px;
}

/* =========================
   STATUS BADGE
========================= */

.badge{
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    display:inline-block;
}

.pending{
    background:rgba(250,204,21,.15);
    color:#facc15;
}

.success{
    background:rgba(34,197,94,.15);
    color:#22c55e;
}

.failed{
    background:rgba(239,68,68,.15);
    color:#ef4444;
}

/* =========================
   DASHBOARD HEADER CARD
========================= */

#dashboard .card{
    background:
    linear-gradient(
        135deg,
        rgba(34,197,94,.15),
        rgba(11,18,32,.9)
    );
}

#dashboard h2{
    font-size:28px;
    margin-bottom:8px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#0f172a;
}

::-webkit-scrollbar-thumb{
    background:#22c55e;
    border-radius:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        position:relative;
    }

    .content{
        padding:20px;
    }

    table{
        display:block;
        overflow-x:auto;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

    <div>
        <h2 id="panelName">USER PANEL</h2>

        <a class="active" onclick="showPage('dashboard', this)">
            <i class="fa fa-home"></i> Dashboard
        </a>

        <a onclick="showPage('profile', this)">
            <i class="fa fa-user"></i> Profil
        </a>

        <a onclick="showPage('transactions', this)">
            <i class="fa fa-receipt"></i> Transaksi
        </a>

        <!-- STORE FIX -->
        <a href="store.html">
            <i class="fa fa-store"></i> Store
        </a>

        <a onclick="logout()" class="logout">
            <i class="fa fa-right-from-bracket"></i> Logout
        </a>
    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">
        © Alvelions 2026
    </div>

</div>

<!-- CONTENT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">
    <div class="card">
        <h2>Dashboard User</h2>
        <p>Selamat datang di panel user Alvelions MC</p>
    </div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
    <div class="card">
        <h2>Profil Saya</h2>
        <p>Username: <span id="username">Loading...</span></p>
        <p>Role: <span id="role">Loading...</span></p>
        <p>Bergabung: <span id="created_at">Loading...</span></p>
    </div>
</div>

<!-- TRANSACTIONS -->
<div id="transactions" class="page">
    <div class="card">
        <h2>Riwayat Transaksi</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ID Payment</th>
                    <th>Produk</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Tanggal</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="transactionList"></tbody>
        </table>
    </div>
</div>

</div>
</div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>

<script>
function showPage(page, el){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(page).classList.add('active');

    document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
    el.classList.add('active');
}

function logout(){
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = 'index.html';
}
</script>

</body>
</html>
