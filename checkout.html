<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVELIONS MC - CHECKOUT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #facc15; /* Kuning Cyber / Neon */
            --secondary: #fbbf24; 
            --bg-dark: #07050f; 
            --card-bg: rgba(255, 255, 255, 0.03);
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(250, 204, 21, 0.08) 0%, transparent 80%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 30px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        .qris-box {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qris-box p {
            font-size: 0.75rem;
            color: var(--secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        #qrisImage {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
            background: #fff; /* Menjaga QR tetap terbaca jika transparan */
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        select option {
            background: #0c091a;
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-link:hover { color: var(--primary); }
        .quantity-box{
            display:flex;
            align-items:center;
            gap:10px;
        }
        
        .qty-btn{
            width:42px;
            height:42px;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:#000;
            font-size:22px;
            cursor:pointer;
            font-weight:bold;
        }
        
        .qty-btn:hover{
            opacity:.9;
        }
        
        #quantity{
            text-align:center;
            font-weight:bold;
        }
        
        .summary-card{
            margin-top:15px;
            background:rgba(250,204,21,.08);
            border:1px solid rgba(250,204,21,.3);
            border-radius:14px;
            padding:15px;
        }
        
        .summary-row{
            display:flex;
            justify-content:space-between;
            margin-bottom:8px;
        }
        
        .summary-row:last-child{
            margin-bottom:0;
            font-size:18px;
            font-weight:bold;
            color:var(--primary);
        }

        /* QRIS TYPE TOGGLE */
        .qris-type-toggle{
            display:flex;
            gap:8px;
            margin-bottom:12px;
        }

        .qris-type-btn{
            flex:1;
            padding:8px 6px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:10px;
            color:#94a3b8;
            font-size:0.7rem;
            font-weight:700;
            cursor:pointer;
            text-transform:uppercase;
            letter-spacing:0.5px;
            transition:0.2s;
        }

        .qris-type-btn.active{
            background:var(--primary);
            color:#000;
            border-color:var(--primary);
            box-shadow:0 0 10px rgba(250,204,21,.3);
        }

        /* CART */
        .cart-section{
            margin:16px 0;
            background:rgba(0,0,0,0.25);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:14px;
            padding:14px;
        }

        .cart-section-title{
            font-size:0.7rem;
            font-weight:700;
            color:#94a3b8;
            text-transform:uppercase;
            letter-spacing:0.5px;
            margin-bottom:10px;
        }

        .cart-empty{
            font-size:0.75rem;
            color:rgba(255,255,255,0.3);
            text-align:center;
            padding:10px 0;
        }

        .cart-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:8px 0;
            border-bottom:1px solid rgba(255,255,255,0.06);
            gap:8px;
        }

        .cart-item:last-child{
            border-bottom:none;
        }

        .cart-item-name{
            font-size:0.8rem;
            font-weight:600;
        }

        .cart-item-price{
            font-size:0.7rem;
            color:#94a3b8;
            margin-top:2px;
        }

        .cart-item-actions{
            display:flex;
            align-items:center;
            gap:6px;
            flex-shrink:0;
        }

        .qty-btn-sm{
            width:26px;
            height:26px;
            border:none;
            border-radius:8px;
            background:rgba(250,204,21,0.15);
            color:var(--primary);
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
        }

        .btn-remove{
            width:26px;
            height:26px;
            border:none;
            border-radius:8px;
            background:rgba(239,68,68,0.15);
            color:var(--danger);
            font-size:13px;
            font-weight:bold;
            cursor:pointer;
        }

        .btn-add-cart{
            width:100%;
            padding:10px;
            background:rgba(250,204,21,0.12);
            border:1px solid var(--primary);
            color:var(--primary);
            border-radius:10px;
            font-weight:700;
            font-size:0.75rem;
            cursor:pointer;
            margin-top:8px;
            text-transform:uppercase;
            letter-spacing:0.5px;
        }

        .btn-add-cart:hover{
            background:var(--primary);
            color:#000;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="qris-box">
            <p>QRIS Pembayaran</p>

            <div class="qris-type-toggle">
                <button type="button" id="btnQrisNasional" class="qris-type-btn active" onclick="setQrisType('nasional')">Nasional</button>
                <button type="button" id="btnQrisInternasional" class="qris-type-btn" onclick="setQrisType('internasional')">Internasional</button>
            </div>

            <img id="qrisImage" alt="Memuat QRIS...">
        </div>

        <h1>Checkout Order</h1>

        <div class="form-group">
            <label>Username Akun Web</label>
            <input id="username" placeholder="Masukkan username terdaftar">
        </div>

        <div class="form-group">
            <label>Gamertag Minecraft</label>
            <input id="gamertag" placeholder="Contoh: SteveAlvelions">
        </div>

        <div class="form-group">
            <label>Nomor HP / WhatsApp</label>
            <input id="phone" placeholder="Contoh: 0851xxxxxxxx">
        </div>

        <div class="form-group">
            <label>Pilih Produk</label>
            <select id="productSelect">
                <option value="">-- Pilih Produk --</option>
            </select>
        </div>
        <div class="form-group">
        <label>Jumlah</label>
        
        <div class="quantity-box">
        
        <button
        type="button"
        class="qty-btn"
        onclick="changeQty(-1)">−</button>
        
        <input
        id="quantity"
        type="number"
        value="1"
        min="1">
        
        <button
        type="button"
        class="qty-btn"
        onclick="changeQty(1)">+</button>
        
        </div>

        <button type="button" class="btn-add-cart" onclick="addToCart()">+ Tambah ke Keranjang</button>
        </div>

        <div class="cart-section">
            <div class="cart-section-title">🛒 Keranjang Belanja</div>
            <div id="cartEmpty" class="cart-empty">Keranjang masih kosong</div>
            <div id="cartList"></div>
        </div>

        <div class="summary-card">
        <div class="summary-row">
        <span>Total Belanja</span>
        <span id="grandTotalText">Rp0</span>
        </div>
        </div>
        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="payment">
                <option value="dana">DANA</option>
                <option value="gopay">GOPAY</option>
                <option value="ovo">OVO</option>
                <option value="shopeepay">SHOPEEPAY</option>
            </select>
        </div>

        <div class="form-group">
            <label>ID Transaksi Payment (Dari Aplikasi E-Wallet)</label>
            <input id="id_transaksi_payment" placeholder="Masukkan Kode / Ref ID Transaksi">
        </div>

        <button id="submitBtn" class="btn" onclick="submitOrder()">
            Kirim Pesanan
        </button>

        <a href="index.html" class="back-link">← Kembali ke Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
function generateID() {
    return 'INV-' + Date.now() + '-' + Math.floor(Math.random() * 9999);
}

function getWIBTime() {
    return new Date().toLocaleString("sv-SE", {
        timeZone: "Asia/Jakarta"
    }).replace("T", " ");
}

/* =========================
   QRIS (NASIONAL / INTERNASIONAL)
========================= */
const QRIS_FILES = {
    nasional: "alvelions.jpeg",
    internasional: "alvelions-intl.jpeg"
};

let currentQrisType = "nasional";

function loadQris() {
    const { data } = supabaseClient
        .storage
        .from("qris")
        .getPublicUrl(QRIS_FILES[currentQrisType]);

    document.getElementById("qrisImage").src = data.publicUrl;
}

function setQrisType(type) {
    currentQrisType = type;

    document.getElementById("btnQrisNasional").classList.toggle("active", type === "nasional");
    document.getElementById("btnQrisInternasional").classList.toggle("active", type === "internasional");

    loadQris();
}

loadQris();

/* =========================
   LOAD PRODUCTS
========================= */
async function loadProducts() {

    const select = document.getElementById("productSelect");

    // Reset isi dropdown
    select.innerHTML = '<option value="">-- Pilih Produk --</option>';

    const { data, error } = await supabaseClient
        .from("products")
        .select("id, name, description, price")
        .order("name");

    console.log("Products:", data);
    console.log("Error:", error);

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    if (!data || data.length === 0) {
        console.log("Tidak ada produk.");
        return;
    }

    data.forEach(item => {

        const option = document.createElement("option");

        option.value = item.id;
        option.textContent = item.name;

        option.dataset.price = item.price;
        option.dataset.name = item.name;
        option.dataset.description = item.description ?? "";

        select.appendChild(option);

    });
}

loadProducts();
function rupiah(x){
    return "Rp" + Number(x).toLocaleString("id-ID");
}

function changeQty(v){

    const qty=document.getElementById("quantity");

    qty.value=Math.max(
        1,
        Number(qty.value)+v
    );

}

/* =========================
   KERANJANG (CART)
========================= */
let cart = [];

function addToCart() {
    const select = document.getElementById("productSelect");

    if (!select.value) {
        alert("Pilih produk terlebih dahulu!");
        return;
    }

    const id = select.value;
    const name = select.options[select.selectedIndex].dataset.name;
    const price = Number(select.options[select.selectedIndex].dataset.price);
    const qty = Math.max(1, parseInt(document.getElementById("quantity").value) || 1);

    const existing = cart.find(item => item.id === id);
    if (existing) {
        existing.qty += qty;
    } else {
        cart.push({ id, name, price, qty });
    }

    document.getElementById("quantity").value = 1;
    renderCart();
}

function changeCartQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;

    item.qty = Math.max(1, item.qty + delta);
    renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    renderCart();
}

function renderCart() {
    const list = document.getElementById("cartList");
    const emptyMsg = document.getElementById("cartEmpty");

    list.innerHTML = "";
    emptyMsg.style.display = cart.length === 0 ? "block" : "none";

    let grandTotal = 0;

    cart.forEach(item => {
        const subtotal = item.price * item.qty;
        grandTotal += subtotal;

        const row = document.createElement("div");
        row.className = "cart-item";
        row.innerHTML = `
            <div>
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">${rupiah(item.price)} x ${item.qty} = ${rupiah(subtotal)}</div>
            </div>
            <div class="cart-item-actions">
                <button type="button" class="qty-btn-sm" onclick="changeCartQty('${item.id}', -1)">−</button>
                <span>${item.qty}</span>
                <button type="button" class="qty-btn-sm" onclick="changeCartQty('${item.id}', 1)">+</button>
                <button type="button" class="btn-remove" onclick="removeFromCart('${item.id}')">✕</button>
            </div>
        `;
        list.appendChild(row);
    });

    document.getElementById("grandTotalText").textContent = rupiah(grandTotal);
}
/* =========================
   SUBMIT ORDER
========================= */
async function submitOrder() {
    const submitBtn = document.getElementById("submitBtn");

    const username = document.getElementById("username").value.trim();
    const gamertag = document.getElementById("gamertag").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const id_transaksi_payment = document.getElementById("id_transaksi_payment").value.trim();
    const payment = document.getElementById("payment").value;

    // Validasi input kosong
    if (!username || !gamertag || !phone) {
        alert("Isi semua data!");
        return;
    }
    if (cart.length === 0) {
        alert("Keranjang masih kosong! Tambahkan produk terlebih dahulu.");
        return;
    }
    if (!id_transaksi_payment) {
        alert("ID Transaksi Payment wajib diisi!");
        return;
    }

    // Mengunci tombol agar tidak diklik berkali-kali saat proses kirim sedang berjalan
    submitBtn.disabled = true;
    submitBtn.textContent = "Memproses...";

    // CEK USERNAME DI TABEL users_profile
    const { data: user, error: userError } = await supabaseClient
        .from("users_profile")
        .select("username")
        .eq("username", username);

    if (userError) {
        console.error(userError);
        alert("Terjadi kesalahan saat mengecek akun!");
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    if (!user || user.length === 0) {
        alert("Username tidak terdaftar di sistem!\nSilakan buat akun terlebih dahulu.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    const id_transaksi = generateID();
    const created_at = getWIBTime();
    const grandTotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    // INSERT KE TABEL orders - satu baris per item keranjang, berbagi id_transaksi yang sama
    const rows = cart.map(item => ({
        id_transaksi,
        id_transaksi_payment,
        product_id: item.id,
        quantity: item.qty,
        total_price: item.price * item.qty,
        username,
        gamertag,
        phone,
        payment_method: payment,
        qris_type: currentQrisType,
        status: "pending",
        created_at
    }));

    // INSERT KE TABEL orders
    const { error } = await supabaseClient
        .from("orders")
        .insert(rows);

    if (error) {
        console.error(error);
        alert("Gagal membuat order: " + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    // Struktur format teks untuk WhatsApp admin agar lebih rapi
    const itemsText = cart
        .map(item => `- ${item.name} x${item.qty} = ${rupiah(item.price * item.qty)}`)
        .join("\n    ");

    const waText = `
    Halo Admin Alvelions MC,
    
    Saya sudah melakukan checkout.
    
    • Invoice : ${id_transaksi}
    • Username : ${username}
    • Gamertag : ${gamertag}
    
    • Produk :
    ${itemsText}
    • Total : ${rupiah(grandTotal)}
    
    • Metode : ${payment.toUpperCase()}
    • Tipe QRIS : ${currentQrisType.toUpperCase()}
    • Ref ID : ${id_transaksi_payment}
    
    Mohon segera diproses.
    `;
    alert(
    "Pesanan berhasil dikirim!\n\n"+
    "ID: " + id_transaksi + "\n"+
    "Invoice berhasil disalin."
    );
    navigator.clipboard.writeText(id_transaksi);
    // Membuka link WhatsApp di tab baru
    window.open(`https://wa.me/628994491500?text=${encodeURIComponent(waText)}`, '_blank');
    // Memindahkan halaman user ke dashboard
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
