<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVELIONS MC - CHECKOUT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #facc15; /* Kuning Cyber / Neon */
            --secondary: #fbbf24; 
            --bg-dark: #07050f; 
            --card-bg: rgba(255, 255, 255, 0.03);
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(250, 204, 21, 0.08) 0%, transparent 80%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 30px 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        .qris-box {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qris-box p {
            font-size: 0.75rem;
            color: var(--secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        #qrisImage {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
            background: #fff; /* Menjaga QR tetap terbaca jika transparan */
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        select option {
            background: #0c091a;
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-link:hover { color: var(--primary); }
        .quantity-box{
            display:flex;
            align-items:center;
            gap:10px;
        }
        
        .qty-btn{
            width:42px;
            height:42px;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:#000;
            font-size:22px;
            cursor:pointer;
            font-weight:bold;
        }
        
        .qty-btn:hover{
            opacity:.9;
        }
        
        #quantity{
            text-align:center;
            font-weight:bold;
        }
        
        .summary-card{
            margin-top:15px;
            background:rgba(250,204,21,.08);
            border:1px solid rgba(250,204,21,.3);
            border-radius:14px;
            padding:15px;
        }
        
        .summary-row{
            display:flex;
            justify-content:space-between;
            margin-bottom:8px;
        }
        
        .summary-row:last-child{
            margin-bottom:0;
            font-size:18px;
            font-weight:bold;
            color:var(--primary);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="qris-box">
            <p>QRIS Pembayaran</p>
            <img id="qrisImage" alt="Memuat QRIS...">
        </div>

        <h1>Checkout Order</h1>

        <div class="form-group">
            <label>Username Akun Web</label>
            <input id="username" placeholder="Masukkan username terdaftar">
        </div>

        <div class="form-group">
            <label>Gamertag Minecraft</label>
            <input id="gamertag" placeholder="Contoh: SteveAlvelions">
        </div>

        <div class="form-group">
            <label>Nomor HP / WhatsApp</label>
            <input id="phone" placeholder="Contoh: 0851xxxxxxxx">
        </div>

        <div class="form-group">
            <label>Pilih Produk</label>
            <select id="productSelect">
                <option value="">-- Pilih Produk --</option>
            </select>
        </div>
        <div class="form-group">
        <label>Jumlah</label>
        
        <div class="quantity-box">
        
        <button
        type="button"
        class="qty-btn"
        onclick="changeQty(-1)">−</button>
        
        <input
        id="quantity"
        type="number"
        value="1"
        min="1">
        
        <button
        type="button"
        class="qty-btn"
        onclick="changeQty(1)">+</button>
        
        </div>
        </div>
        
        <div class="summary-card">
        
        <div class="summary-row">
        <span>Harga</span>
        <span id="priceText">Rp0</span>
        </div>
        
        <div class="summary-row">
        <span>Total</span>
        <span id="totalText">Rp0</span>
        </div>
        
        </div>
        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="payment">
                <option value="dana">DANA</option>
                <option value="gopay">GOPAY</option>
                <option value="ovo">OVO</option>
                <option value="shopeepay">SHOPEEPAY</option>
            </select>
        </div>

        <div class="form-group">
            <label>ID Transaksi Payment (Dari Aplikasi E-Wallet)</label>
            <input id="id_transaksi_payment" placeholder="Masukkan Kode / Ref ID Transaksi">
        </div>

        <button id="submitBtn" class="btn" onclick="submitOrder()">
            Kirim Pesanan
        </button>

        <a href="index.html" class="back-link">← Kembali ke Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
function generateID() {
    return 'INV-' + Date.now() + '-' + Math.floor(Math.random() * 9999);
}

function getWIBTime() {
    return new Date().toLocaleString("sv-SE", {
        timeZone: "Asia/Jakarta"
    }).replace("T", " ");
}

/* =========================
   LOAD QRIS
========================= */
function loadQris() {
    const { data } = supabaseClient
        .storage
        .from("qris")
        .getPublicUrl("alvelions.jpeg");

    document.getElementById("qrisImage").src = data.publicUrl;
}
loadQris();

/* =========================
   LOAD PRODUCTS
========================= */
async function loadProducts() {

    const select = document.getElementById("productSelect");

    // Reset isi dropdown
    select.innerHTML = '<option value="">-- Pilih Produk --</option>';

    const { data, error } = await supabaseClient
        .from("products")
        .select("id, name, description, price")
        .order("name");

    console.log("Products:", data);
    console.log("Error:", error);

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    if (!data || data.length === 0) {
        console.log("Tidak ada produk.");
        return;
    }

    data.forEach(item => {

        const option = document.createElement("option");

        option.value = item.id;
        option.textContent = item.name;

        option.dataset.price = item.price;
        option.dataset.name = item.name;
        option.dataset.description = item.description ?? "";

        select.appendChild(option);

    });

    updateSummary();
}

loadProducts();
function rupiah(x){
    return "Rp" + Number(x).toLocaleString("id-ID");
}

function updateSummary(){

    const select=document.getElementById("productSelect");

    if(!select.value){
        document.getElementById("priceText").textContent="Rp0";
        document.getElementById("totalText").textContent="Rp0";
        return;
    }

    const price=Number(
        select.options[select.selectedIndex].dataset.price
    );

    const qty=Math.max(
        1,
        Number(document.getElementById("quantity").value)
    );

    document.getElementById("priceText").textContent =
        rupiah(price);

    document.getElementById("totalText").textContent =
        rupiah(price * qty);

}

function changeQty(v){

    const qty=document.getElementById("quantity");

    qty.value=Math.max(
        1,
        Number(qty.value)+v
    );

    updateSummary();

}

document
.getElementById("productSelect")
.addEventListener("change", updateSummary);

document
.getElementById("quantity")
.addEventListener("input", updateSummary);
/* =========================
   SUBMIT ORDER
========================= */
async function submitOrder() {
    const submitBtn = document.getElementById("submitBtn");
    
    // Mendapatkan Element Select & Teks Nama Produk yang dipilih
    const productSelect = document.getElementById("productSelect");
    const productId = productSelect.value;
    const productName = productSelect.options[productSelect.selectedIndex]?.dataset.name || "";
    const quantity=parseInt(document.getElementById("quantity").value)||1;
    const username = document.getElementById("username").value.trim();
    const gamertag = document.getElementById("gamertag").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const id_transaksi_payment = document.getElementById("id_transaksi_payment").value.trim();
    const payment = document.getElementById("payment").value;
    const unitPrice=Number(productSelect.options[productSelect.selectedIndex].dataset.price);
    const totalPrice=unitPrice*quantity;

    // Validasi input kosong
    if (!username || !gamertag || !phone) {
        alert("Isi semua data!");
        return;
    }
    if (!productId) {
        alert("Pilih produk terlebih dahulu!");
        return;
    }
    if (!id_transaksi_payment) {
        alert("ID Transaksi Payment wajib diisi!");
        return;
    }

    // Mengunci tombol agar tidak diklik berkali-kali saat proses kirim sedang berjalan
    submitBtn.disabled = true;
    submitBtn.textContent = "Memproses...";

    // CEK USERNAME DI TABEL users_profile
    const { data: user, error: userError } = await supabaseClient
        .from("users_profile")
        .select("username")
        .eq("username", username);

    if (userError) {
        console.error(userError);
        alert("Terjadi kesalahan saat mengecek akun!");
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    if (!user || user.length === 0) {
        alert("Username tidak terdaftar di sistem!\nSilakan buat akun terlebih dahulu.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    const id_transaksi = generateID();
    const created_at = getWIBTime();

    // INSERT KE TABEL orders
    const { error } = await supabaseClient
        .from("orders")
        .insert({
        id_transaksi,
        id_transaksi_payment,
        product_id:productId,
        quantity:quantity,
        total_price:totalPrice,
        username,
        gamertag,
        phone,
        payment_method:payment,
        status:"pending",
        created_at
        });

    if (error) {
        console.error(error);
        alert("Gagal membuat order: " + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Kirim Pesanan";
        return;
    }

    alert("Pesanan berhasil dikirim!\nID: " + id_transaksi);
    
    // Struktur format teks untuk WhatsApp admin agar lebih rapi
    const waText = `
    Halo Admin Alvelions MC,
    
    Saya sudah melakukan checkout.
    
    • Invoice : ${id_transaksi}
    • Username : ${username}
    • Gamertag : ${gamertag}
    
    • Produk : ${productName}
    • Harga : ${rupiah(unitPrice)}
    • Jumlah : ${quantity}
    • Total : ${rupiah(totalPrice)}
    
    • Metode : ${payment.toUpperCase()}
    • Ref ID : ${id_transaksi_payment}
    
    Mohon segera diproses.
    `;
    alert(
    "Pesanan berhasil!\n\n"+
    "Invoice berhasil disalin."
    );
    navigator.clipboard.writeText(id_transaksi);
    // Membuka link WhatsApp di tab baru
    window.open(`https://wa.me/628994491500?text=${encodeURIComponent(waText)}`, '_blank');
    // Memindahkan halaman user ke dashboard
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
