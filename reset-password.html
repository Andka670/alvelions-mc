<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){var r=document.documentElement,t='dark';try{var h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(new Date()));t=(h>=6&&h<18)?'light':'dark';var c=JSON.parse(localStorage.getItem('alvelions-theme-override-v5')||'null');if(c&&(c.theme==='light'||c.theme==='dark')&&c.until>Date.now())t=c.theme}catch(e){}r.setAttribute('data-theme',t)})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa password – ALVELIONS MC</title>
<link rel="icon" type="image/png" href="assets/alvelions-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body class="theme-home">
<div class="auth">
<aside class="auth-side"><img class="float" src="assets/alvelions-logo.png" alt="Logo ALVELIONS MC"><h2>Lupa password? Tenang, kami bantu.</h2></aside>
<main class="auth-main"><button class="btn icon-btn theme-pos" id="themeBtn" aria-label="Ganti tema"></button>
<div class="auth-card"><a class="brand m-brand" href="index.html"><img src="assets/alvelions-logo.png" alt="">ALVELIONS MC</a>
<h1>Lupa password</h1><p class="sub">Masukkan email akunmu. Kami kirim link untuk membuat password baru.</p>
<label class="field"><span>Email</span><div><i class="l fa-solid fa-envelope"></i><input id="email" type="email" placeholder="nama@email.com" autocomplete="email"></div></label><button class="btn btn-gold" onclick="sendResetLink()">Kirim link reset</button>
<p id="message" role="status"></p>
<p class="alt">Ingat password? <a href="login.html">Kembali ke login</a></p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
async function sendResetLink() {
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    if (!email) {
        message.textContent = "Masukkan email terlebih dahulu.";
        message.style.color = "#ef4444";
        return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/password-baru.html"
    });

    if (error) {
        message.textContent = error.message;
        message.style.color = "#ef4444";
    } else {
        message.textContent = "Link reset password berhasil dikirim ke email Anda.";
        message.style.color = "#22c55e";
    }
}
</script>
<script>
function setT(t,s){const r=document.documentElement,b=document.getElementById("themeBtn");r.setAttribute("data-theme",t);b.innerHTML='<i class="fa-solid fa-'+(t==="dark"?"sun":"moon")+'"></i>';b.setAttribute("aria-label",t==="dark"?"Ganti ke tema siang":"Ganti ke tema malam");if(s)try{localStorage.setItem("alvelions-theme-override-v5",JSON.stringify({theme:t,until:Date.now()+12*36e5}))}catch(e){}}
setT(document.documentElement.getAttribute("data-theme"),false);
document.getElementById("themeBtn").onclick=()=>setT(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);
document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye),s=i.type==="password";i.type=s?"text":"password";b.innerHTML='<i class="fa-regular fa-eye'+(s?'-slash':'')+'"></i>'});
document.querySelector(".auth-card").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")sendResetLink()});
</script>
<script src="js/atmosphere-effects.js"></script>
</body></html>
