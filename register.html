<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){var r=document.documentElement,t='dark';try{var h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(new Date()));t=(h>=6&&h<18)?'light':'dark';var c=JSON.parse(localStorage.getItem('alvelions-theme-override-v5')||'null');if(c&&(c.theme==='light'||c.theme==='dark')&&c.until>Date.now())t=c.theme}catch(e){}r.setAttribute('data-theme',t)})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar – ALVELIONS MC</title>
<link rel="icon" type="image/png" href="assets/alvelions-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body class="theme-home">
<div class="auth">
<aside class="auth-side"><img class="float" src="assets/alvelions-logo.png" alt="Logo ALVELIONS MC"><h2>Satu akun untuk semua pembelianmu.</h2><ul><li><span class="ic"><i class="fa-solid fa-store"></i></span>Beli rank dan item lewat checkout</li><li><span class="ic"><i class="fa-solid fa-receipt"></i></span>Riwayat transaksi tersimpan di dashboard</li><li><span class="ic"><i class="fa-solid fa-user-check"></i></span>Username akun dipakai otomatis saat checkout</li></ul></aside>
<main class="auth-main"><button class="btn icon-btn theme-pos" id="themeBtn" aria-label="Ganti tema"></button>
<div class="auth-card"><a class="brand m-brand" href="index.html"><img src="assets/alvelions-logo.png" alt="">ALVELIONS MC</a>
<h1>Daftar</h1><p class="sub">Buat akun gratis untuk belanja rank dan item.</p>
<label class="field"><span>Username</span><div><i class="l fa-solid fa-user"></i><input id="username" type="text" placeholder="Username kamu" autocomplete="username"></div></label><label class="field"><span>Email</span><div><i class="l fa-solid fa-envelope"></i><input id="email" type="email" placeholder="nama@email.com" autocomplete="email"></div></label><label class="field"><span>Password</span><div><i class="l fa-solid fa-lock"></i><input id="password" type="password" placeholder="Buat password" autocomplete="new-password"><button type="button" class="eye" aria-label="Tampilkan password" data-eye="password"><i class="fa-regular fa-eye"></i></button></div><small>Minimal 6 karakter.</small></label><button class="btn btn-gold" onclick="register()">Buat akun</button>
<p id="message" role="status"></p>
<p class="alt">Sudah punya akun? <a href="login.html">Masuk</a><br><a href="index.html">Kembali ke beranda</a></p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
function setT(t,s){const r=document.documentElement,b=document.getElementById("themeBtn");r.setAttribute("data-theme",t);b.innerHTML='<i class="fa-solid fa-'+(t==="dark"?"sun":"moon")+'"></i>';b.setAttribute("aria-label",t==="dark"?"Ganti ke tema siang":"Ganti ke tema malam");if(s)try{localStorage.setItem("alvelions-theme-override-v5",JSON.stringify({theme:t,until:Date.now()+12*36e5}))}catch(e){}}
setT(document.documentElement.getAttribute("data-theme"),false);
document.getElementById("themeBtn").onclick=()=>setT(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);
document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye),s=i.type==="password";i.type=s?"text":"password";b.innerHTML='<i class="fa-regular fa-eye'+(s?'-slash':'')+'"></i>'});
document.querySelector(".auth-card").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")register()});
</script>
<script src="js/atmosphere-effects.js"></script>
</body></html>
