<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){var r=document.documentElement,t='dark';try{var h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(new Date()));t=(h>=6&&h<18)?'light':'dark';var c=JSON.parse(localStorage.getItem('alvelions-theme-override-v5')||'null');if(c&&(c.theme==='light'||c.theme==='dark')&&c.until>Date.now())t=c.theme}catch(e){}r.setAttribute('data-theme',t)})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk – ALVELIONS MC</title>
<link rel="icon" type="image/png" href="assets/alvelions-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body class="theme-home">
<div class="auth">
<aside class="auth-side"><img class="float" src="assets/alvelions-logo.png" alt="Logo ALVELIONS MC"><h2>Masuk untuk membeli rank dan memantau pesananmu.</h2><ul><li><span class="ic"><i class="fa-solid fa-receipt"></i></span>Pantau status pesanan di dashboard</li><li><span class="ic"><i class="fa-solid fa-bolt"></i></span>Checkout memakai username akunmu</li><li><span class="ic"><i class="fa-solid fa-crown"></i></span>Rank dan item dikirim ke gamertag-mu</li></ul></aside>
<main class="auth-main"><button class="btn icon-btn theme-pos" id="themeBtn" aria-label="Ganti tema"></button>
<div class="auth-card"><a class="brand m-brand" href="index.html"><img src="assets/alvelions-logo.png" alt="">ALVELIONS MC</a>
<h1>Masuk</h1><p class="sub">Masuk ke akun ALVELIONS MC kamu.</p>
<label class="field"><span>Email</span><div><i class="l fa-solid fa-envelope"></i><input id="email" type="email" placeholder="nama@email.com" autocomplete="email"></div></label><label class="field"><span>Password</span><div><i class="l fa-solid fa-lock"></i><input id="password" type="password" placeholder="Password kamu" autocomplete="current-password"><button type="button" class="eye" aria-label="Tampilkan password" data-eye="password"><i class="fa-regular fa-eye"></i></button></div></label><div class="row"><a href="reset-password.html">Lupa password?</a></div><button class="btn btn-gold" onclick="login()">Masuk</button>
<p id="message" role="status"></p>
<p class="alt">Belum punya akun? <a href="register.html">Daftar</a><br><a href="index.html">Kembali ke beranda</a></p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
// Skrip pelindung sesi dijalankan paling akhir setelah semua library siap
document.addEventListener("DOMContentLoaded", async () => {
    try {
        if (typeof supabaseClient !== 'undefined') {
            // 1. Cek sesi aktif dari Supabase Auth
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

            if (!authError && user) {
                console.log("User teridentifikasi. Mengambil profile dari database...");

                // 2. Query ke tabel users_profile menggunakan ID user yang aktif
                const { data: profile, error: profileError } = await supabaseClient
                    .from('users_profile')
                    .select('role')
                    .eq('id', user.id) // Sesuai dengan primary key ID / Relasi Auth ID di tabel users_profile
                    .single();

                if (profileError) {
                    console.error("Gagal memuat tabel users_profile:", profileError.message);
                    return;
                }

                // 3. Cek isi text role dan alihkan halaman secara instan
                if (profile && profile.role === "admin") {
                    window.location.replace("admin.html");
                } else {
                    window.location.replace("dashboard.html");
                }
            }
        } else {
            console.error("Supabase client belum terdeteksi. Cek konfigurasi js/supabase.js Anda.");
        }
    } catch (err) {
        console.error("Sesi bermasalah atau gagal terhubung ke database:", err);
    }
});
</script>
<script>
function setT(t,s){const r=document.documentElement,b=document.getElementById("themeBtn");r.setAttribute("data-theme",t);b.innerHTML='<i class="fa-solid fa-'+(t==="dark"?"sun":"moon")+'"></i>';b.setAttribute("aria-label",t==="dark"?"Ganti ke tema siang":"Ganti ke tema malam");if(s)try{localStorage.setItem("alvelions-theme-override-v5",JSON.stringify({theme:t,until:Date.now()+12*36e5}))}catch(e){}}
setT(document.documentElement.getAttribute("data-theme"),false);
document.getElementById("themeBtn").onclick=()=>setT(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);
document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye),s=i.type==="password";i.type=s?"text":"password";b.innerHTML='<i class="fa-regular fa-eye'+(s?'-slash':'')+'"></i>'});
document.querySelector(".auth-card").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")login()});
</script>
<script src="js/atmosphere-effects.js"></script>
</body></html>
